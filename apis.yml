aid: lizzyai
name: Lizzyai
description: >-
  Lizzy is a generative-AI platform for legal professionals, delivering a secure Gen
  AI workspace across all practice areas through both a web application and a Microsoft
  Word/Outlook add-in. It supports contract drafting, review, analysis, and proofreading,
  customizable legal workflows and playbooks, in-document citations, redlining and
  track-changes, and the handling of long, scanned, watermarked, and multiple documents.
  A multi-LLM approach routes each task to the most capable model, and firms can train
  a private model that embeds their own know-how. Built for enterprise IT with a zero-trust
  architecture, no training on customer data, PII anonymization, SSO via SAML and OAuth
  2.0, and shared, VPC, or self-hosted deployment options.
